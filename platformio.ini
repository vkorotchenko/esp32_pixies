[platformio]
default_envs = esp32s3_n16r8

[env]
lib_deps =
    bblanchon/ArduinoJson@6.21.5
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32s3_n16r8]
platform = espressif32@7.1.3
board = esp32s3_n16r8
framework = arduino
build_src_filter = +<*> -<diagnostics/>
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    web/index.html
    web/app.js
    web/styles.css
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPIXIES_LED_PIN=4
    -DPIXIES_LED_WS2811=1
    -DPIXIES_COLOR_GRB=0
    -DPIXIES_CURRENT_MA=9000
    -DPIXIES_RECOVERY_PIN=-1
lib_deps =
    ${env.lib_deps}
    makuna/NeoPixelBus@2.8.4
    h2zero/NimBLE-Arduino@2.5.1
monitor_speed = 115200
extra_scripts = post:scripts/check_build.py

[env:led_diag_adafruit]
extends = env:esp32s3_n16r8
build_src_filter = -<*> +<diagnostics/LedLibraryTest.cpp>
board_build.embed_txtfiles =
build_flags =
    ${env:esp32s3_n16r8.build_flags}
    -DPIXIES_DIAGNOSTIC_ADAFRUIT
lib_deps = adafruit/Adafruit NeoPixel@1.15.5

[env:led_diag_adafruit_400]
extends = env:led_diag_adafruit
build_flags =
    ${env:led_diag_adafruit.build_flags}
    -DPIXIES_DIAGNOSTIC_400KHZ

[env:led_diag_fastled]
extends = env:esp32s3_n16r8
build_src_filter = -<*> +<diagnostics/LedLibraryTest.cpp>
board_build.embed_txtfiles =
build_flags =
    ${env:esp32s3_n16r8.build_flags}
    -DPIXIES_DIAGNOSTIC_FASTLED
lib_deps = fastled/FastLED@3.9.20

[env:led_diag_sequential]
extends = env:led_diag_fastled
build_src_filter = -<*> +<diagnostics/LedSequentialTest.cpp>
build_flags =
    ${env:led_diag_fastled.build_flags}
    -Wl,--wrap=nvs_flash_init

[env:led_diag_sequential_neopixelbus]
extends = env:esp32s3_n16r8
build_src_filter = -<*> +<diagnostics/LedSequentialTest.cpp>
board_build.embed_txtfiles =
build_flags =
    ${env:esp32s3_n16r8.build_flags}
    -DPIXIES_DIAGNOSTIC_NEOPIXELBUS
    -Wl,--wrap=nvs_flash_init
lib_deps = makuna/NeoPixelBus@2.8.4

[env:gpio4_diag_static]
extends = env:esp32s3_n16r8
build_src_filter = -<*> +<diagnostics/Gpio4StaticTest.cpp>
board_build.embed_txtfiles =
build_flags =
    ${env:esp32s3_n16r8.build_flags}
    -Wl,--wrap=nvs_flash_init
lib_deps =

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    ${env.build_flags}
    !python3 scripts/native_crypto_flags.py
    -Itest/stubs
    -Wall
    -Wextra
    -Werror
