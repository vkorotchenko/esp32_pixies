[platformio]
default_envs = esp32s3_n16r8

[env]
lib_deps =
    bblanchon/ArduinoJson@6.21.5
build_flags = -std=gnu++17
build_unflags = -std=gnu++11

[env:esp32s3_n16r8]
platform = espressif32@7.1.3
board = esp32s3_n16r8
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    web/index.html
    web/app.js
    web/styles.css
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DPIXIES_LED_PIN=4
    -DPIXIES_COLOR_GRB=1
    -DPIXIES_CURRENT_MA=9000
    -DPIXIES_RECOVERY_PIN=-1
lib_deps =
    ${env.lib_deps}
    makuna/NeoPixelBus@2.8.4
monitor_speed = 115200
extra_scripts = post:scripts/check_build.py

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags =
    ${env.build_flags}
    -Itest/stubs
    -Wall
    -Wextra
    -Werror
