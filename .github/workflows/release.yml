name: Publish release
on:
  push:
    branches: [main]
    paths: [version.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
  mobile:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npm run typecheck && npm run lint && npm test -- --runInBand
        working-directory: mobile
  firmware:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install platformio==6.2.0
      - run: make firmware PIO=pio
      - run: python scripts/release_materials.py firmware --pio pio
      - run: cp .pio/build/esp32s3_n16r8/firmware.bin dist/materials/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            dist/materials/firmware.bin
            dist/materials/pixies-firmware-materials.zip
          if-no-files-found: error
  android:
    needs: mobile
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - name: Build with production signing only
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os, pathlib, subprocess
          names = ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")
          if not all(os.environ.get(name) for name in names):
              raise SystemExit("Missing production signing secrets in release environment")
          key = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pixies-release.p12"
          try:
              key.write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
              key.chmod(0o600)
              env = dict(os.environ, ANDROID_KEYSTORE_PATH=str(key))
              subprocess.run(["make", "android-release"], env=env, check=True)
          finally:
              key.unlink(missing_ok=True)
          PY
      - run: python scripts/release_materials.py mobile
      - run: cp mobile/android/app/build/outputs/apk/release/app-release.apk dist/materials/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            dist/materials/app-release.apk
            dist/materials/pixies-mobile-materials.zip
          if-no-files-found: error
  publish:
    needs: [firmware, android]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: dist/inputs/firmware
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist/inputs/android
      - name: Validate both artifacts and construct their shared manifest
        run: >-
          python scripts/release.py package
          --firmware dist/inputs/firmware/firmware.bin
          --apk dist/inputs/android/app-release.apk
          --firmware-materials dist/inputs/firmware/pixies-firmware-materials.zip
          --mobile-materials dist/inputs/android/pixies-mobile-materials.zip
      - name: Stage, verify, then publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
