name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Shared version bump
        required: true
        type: choice
        options: [patch, minor, major]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create a version-only release PR and request its checks
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: python scripts/prepare_release.py "$BUMP"
